services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-webdav=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ROOT_USER:-bloodfox}
      AWS_SECRET_ACCESS_KEY: ${S3_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD in .env}
      S3_BUCKET: ${S3_BUCKET:-bloodfox-assets}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3_data:/data
    restart: unless-stopped

  users-service:
    build:
      context: ./users-service
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  notifications-service:
    build:
      context: ./notifications-service
    expose:
      - "8082"
    restart: unless-stopped

  game-store-service:
    build:
      context: ./game-store-service
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      USERS_SERVICE_URL: http://users-service:8081
      S3_ENABLED: "true"
      S3_BUCKET: ${S3_BUCKET:-bloodfox-assets}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ROOT_USER:-bloodfox}
      S3_SECRET_KEY: ${S3_ROOT_PASSWORD:?Set S3_ROOT_PASSWORD in .env}
      S3_ADMIN_TOKEN: ${S3_ADMIN_TOKEN:?Set S3_ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      notifications-service:
        condition: service_started
      users-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - game-store-service
    restart: unless-stopped

volumes:
  db_data:
  s3_data:
