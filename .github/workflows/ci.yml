name: BloodFoxGames CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frontend tests and syntax checks
        working-directory: frontend
        run: npm run check

  backend:
    name: Java and Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Game Store tests
        run: mvn -B -f game-store-service/pom.xml test
      - name: Users Service tests
        run: mvn -B -f users-service/pom.xml test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Notifications Service Python syntax
        run: python -m compileall -q notifications-service

  compose-integration:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      POSTGRES_PASSWORD: ci-postgres-password-change-me
      S3_ROOT_USER: ci-bloodfox
      S3_ROOT_PASSWORD: ci-seaweedfs-password-change-me
      S3_ADMIN_TOKEN: ci-admin-token-change-me
      S3_BUCKET: bloodfox-assets
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start complete stack
        run: docker compose up -d --build
      - name: Run end-to-end smoke scenario
        run: scripts/smoke-test.sh
      - name: Print service status and logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail=200 || true
      - name: Stop stack and remove ephemeral CI volumes
        if: always()
        run: docker compose down -v --remove-orphans
