spring.application.name=game-store-api
app.users-service.url=${USERS_SERVICE_URL:http://users-service:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# S3-compatible object storage (SeaweedFS in local Docker Compose)
app.storage.enabled=${S3_ENABLED:false}
app.storage.bucket=${S3_BUCKET:bloodfox-assets}
app.storage.region=${S3_REGION:us-east-1}
app.storage.endpoint=${S3_ENDPOINT:http://localhost:8333}
app.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:8333}
app.storage.access-key=${S3_ACCESS_KEY:bloodfox}
app.storage.secret-key=${S3_SECRET_KEY:change-this-secret-in-env}
app.storage.admin-token=${S3_ADMIN_TOKEN:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Server-side account sessions. Use SESSION_COOKIE_SECURE=true behind HTTPS in production.
server.servlet.session.timeout=12h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=BFGSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-binding-errors=never
